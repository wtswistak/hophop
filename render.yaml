services:
  - type: web
    name: platform-game-server
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: npm run start -w @game/server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.16.0
      - key: ALLOWED_ORIGINS
        sync: false
